name: Build unsigned IPA

# 设计要点（改过一版，上一版被取消了，日志没来得及提交）：
#   · 不用 concurrency —— 上一版带 cancel-in-progress，疑似把正在跑的自己取消了
#   · 编译步骤单独设超时 + continue-on-error，保证后面"提交日志"那步一定还会跑
#   · 日志在编译后立刻提交回仓库（公开仓库我能匿名读，不需要 token）
#     —— 这是"我能自己看到报错并自动迭代"的关键

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          df -h /

      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Fetch Python-Apple-support
        run: |
          set -e
          URL="https://github.com/beeware/Python-Apple-support/releases/download/3.12-b13/Python-3.12-iOS-support.b13.tar.gz"
          echo "downloading $URL"
          curl -L --fail -o py.tar.gz "$URL"
          mkdir -p /tmp/py && tar xzf py.tar.gz -C /tmp/py
          echo "== 解出来的结构 =="
          find /tmp/py -maxdepth 2 | head -40
          mkdir -p Frameworks Resources
          XC=$(find /tmp/py -maxdepth 2 -name "Python.xcframework" | head -1)
          STD=$(find /tmp/py -maxdepth 2 -name "python-stdlib" | head -1)
          echo "xcframework = $XC"
          echo "stdlib      = $STD"
          [ -n "$XC" ]  && cp -R "$XC"  Frameworks/
          [ -n "$STD" ] && cp -R "$STD" Resources/
          echo "== xcframework 切片 =="
          ls Frameworks/Python.xcframework || true

      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee -a build.log

      - name: Build (unsigned)
        id: build
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild -project CarHeart.xcodeproj -scheme CarHeart \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee -a build.log
          echo "xcodebuild exit: $?"

      # 关键一步：立刻把日志提交回仓库，公开仓库我这边能匿名读到
      - name: Publish build log into repo
        if: always()
        run: |
          set -e
          mkdir -p ci
          [ -f build.log ] || echo "(没有 build.log)" > build.log
          tail -c 300000 build.log > ci/build-log.txt
          git config user.name "carheart-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci/build-log.txt
          git commit -m "ci: build log [skip ci]" || echo "no change"
          git push origin HEAD:main || echo "push failed"

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package unsigned IPA
        if: steps.build.outcome == 'success'
        run: |
          set -e
          APP=$(find build -name "CarHeart.app" -maxdepth 8 | head -1)
          echo "app = $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CarHeart-unsigned.ipa Payload
          ls -lh CarHeart-unsigned.ipa

      - name: Attach IPA to Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CarHeart build ${{ github.run_number }}
          files: CarHeart-unsigned.ipa
          body: |
            未签名 IPA，给 AltStore 侧载用。
            commit: ${{ github.sha }}
