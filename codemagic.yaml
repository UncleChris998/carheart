workflows:
  ios-unsigned:
    name: Build unsigned IPA (for AltStore sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        PY_VER: "3.12"
        PY_SUPPORT_TAG: "3.12-b4"
    scripts:
      - name: Install tools
        script: |
          brew install xcodegen || true
          xcodegen --version

      - name: Fetch Python-Apple-support (iOS xcframework + stdlib)
        script: |
          set -e
          mkdir -p Frameworks
          URL="https://github.com/beeware/Python-Apple-support/releases/download/${PY_SUPPORT_TAG}/Python-${PY_VER}-iOS-support.b${PY_SUPPORT_TAG##*-b}.tar.gz"
          echo "downloading $URL"
          curl -L --fail -o py.tar.gz "$URL"
          tar xzf py.tar.gz -C /tmp
          ls -la /tmp
          # 把 xcframework 和 stdlib 放到工程期望的位置
          cp -R /tmp/Python.xcframework Frameworks/ 2>/dev/null || cp -R /tmp/*/Python.xcframework Frameworks/
          mkdir -p Resources
          cp -R /tmp/python-stdlib Resources/python-stdlib 2>/dev/null || cp -R /tmp/*/python-stdlib Resources/python-stdlib
          du -sh Frameworks/Python.xcframework Resources/python-stdlib

      - name: Bundle carheart python package
        script: |
          set -e
          mkdir -p Resources/python
          rsync -a --exclude '__pycache__' --exclude '*.pyc' \
                ../car-heart/carheart Resources/python/
          du -sh Resources/python

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Build unsigned .app
        script: |
          set -e
          xcodebuild -project CarHeart.xcodeproj -scheme CarHeart \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcpretty || true
          find build -name "*.app" -maxdepth 6

      - name: Package unsigned IPA
        script: |
          set -e
          APP=$(find build -name "CarHeart.app" -maxdepth 6 | head -1)
          echo "app = $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CarHeart-unsigned.ipa Payload
          ls -lh CarHeart-unsigned.ipa

    artifacts:
      - CarHeart-unsigned.ipa
