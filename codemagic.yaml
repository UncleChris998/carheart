workflows:
  ios-unsigned:
    name: Build unsigned IPA (for AltStore sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        PY_VER: "3.12"
        PY_SUPPORT_TAG: "3.12-b13"
    scripts:
      - name: Install tools
        script: |
          brew install xcodegen || true
          xcodegen --version

      - name: Fetch Python-Apple-support (iOS xcframework + stdlib)
        script: |
          set -e
          NAME="Python-${PY_VER}-iOS-support.b13.tar.gz"
          URL="https://github.com/beeware/Python-Apple-support/releases/download/${PY_SUPPORT_TAG}/${NAME}"
          echo "downloading $URL"
          curl -L --fail -o py.tar.gz "$URL"
          mkdir -p /tmp/py && tar xzf py.tar.gz -C /tmp/py
          echo "== 解出来的结构 =="
          find /tmp/py -maxdepth 2 | head -40
          mkdir -p Frameworks Resources
          XC=$(find /tmp/py -maxdepth 2 -name "Python.xcframework" | head -1)
          STD=$(find /tmp/py -maxdepth 2 -name "python-stdlib" | head -1)
          echo "xcframework = $XC"
          echo "stdlib      = $STD"
          [ -n "$XC" ]  && cp -R "$XC"  Frameworks/
          [ -n "$STD" ] && cp -R "$STD" Resources/
          echo "== xcframework 切片 =="
          ls Frameworks/Python.xcframework || true

      - name: Check bundled python package
        script: |
          set -e
          ls -la Resources/python/carheart | head -10
          echo "py 文件数: $(find Resources/python -name '*.py' | wc -l)"
          du -sh Resources/python

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Build unsigned .app
        script: |
          set -e
          xcodebuild -project CarHeart.xcodeproj -scheme CarHeart \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcpretty || true
          find build -name "*.app" -maxdepth 6

      - name: Package unsigned IPA
        script: |
          set -e
          APP=$(find build -name "CarHeart.app" -maxdepth 6 | head -1)
          echo "app = $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CarHeart-unsigned.ipa Payload
          ls -lh CarHeart-unsigned.ipa

    artifacts:
      - CarHeart-unsigned.ipa
